<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="universities.css">
    <title>Universities in Romania</title>
</head>

<body>
    <div>
        <h1>Universities in Romania</h1>

        <label for="q">Filter (optional):</label>
        <input id="q" placeholder="search by name…" />

        <button id="exportCsv">Export CSV</button>

        <div id="status" class="status"></div>

        <table>
            <thead>
                <tr>
                    <th>Name</th>
                    <th>Country</th>
                    <th>Website</th>
                </tr>
            </thead>
            <tbody id="tbody"></tbody>
        </table>
    </div>

    <script src="universities.js"></script>
</body>

</html>
